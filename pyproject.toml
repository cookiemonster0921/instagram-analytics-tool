[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-analytics-tool"
version = "0.1.0"
description = "Offline Instagram export analytics with CLI and local upload UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Instagram Analytics Tool Contributors" }]
dependencies = []

[project.scripts]
instagram-analytics = "instagram_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
